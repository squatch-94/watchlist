:root {
  --pink: #E43D7A;
  --coral: #F7603D;
  --offwhite: #FEF4DD;
  --surface: #FFFEF8;
  --palepink: #FFB7C1;
  --blue: #388EEF;
  --teal: #0AADAB;
  --purple: #9653C9;
  --orange: #FE902D;
  --darkgrey: #575757;
  --text: #1a1a1a;
  --text-muted: #575757;
  --text-faint: #9A9A9A;
  --border: rgba(0,0,0,0.10);
  --border-strong: rgba(0,0,0,0.18);
  --bg: var(--offwhite);
  --col-bg: #FEF4DD;
  --accent: var(--coral);

  --cat-film: #F7603D;      --cat-film-bg: rgba(247,96,61,0.10);
  --cat-tv: #388EEF;        --cat-tv-bg: rgba(56,142,239,0.10);
  --cat-doco: #B5651D;      --cat-doco-bg: rgba(181,101,29,0.10);
  --cat-books: #0AADAB;     --cat-books-bg: rgba(10,173,171,0.10);
  --cat-music: #0AADAB;     --cat-music-bg: rgba(10,173,171,0.10);
  --cat-stage: #9653C9;     --cat-stage-bg: rgba(150,83,201,0.10);
  --cat-other: #6B7280;     --cat-other-bg: rgba(107,114,128,0.10);

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.07);
  --nav-h: 58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;}

/* ── NAV ── */
nav{height:var(--nav-h);background:var(--palepink);display:flex;align-items:center;padding:0 28px;z-index:100;flex-shrink:0;}
.nav-title{font-family:'SashasFont',sans-serif;font-size:22px;font-weight:normal;letter-spacing:0.05em;text-transform:uppercase;color:var(--offwhite);margin-right:36px;flex-shrink:0;}
.nav-title span{color:var(--pink);}
.nav-tabs{display:flex;gap:2px;}
.nav-tab{font-family:'League Spartan',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(0,0,0,0.45);padding:8px 18px;border-radius:4px;cursor:pointer;border:none;background:transparent;transition:all 0.15s;}
.nav-tab:hover{color:#000;background:rgba(0,0,0,0.07);}
.nav-tab.active{color:#fff;background:var(--pink);}
.nav-right{margin-left:auto;}
.add-btn{font-family:'League Spartan',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#fff;background:var(--pink);border:none;padding:8px 18px;border-radius:4px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;}
.add-btn:hover{background:#c4245f;}
.add-btn::before{content:'+';font-size:16px;font-weight:300;line-height:1;}

/* ── PAGES ── */
.page{display:none;overflow:hidden;flex-direction:column;}
.page.active{display:flex;flex-direction:column;overflow:hidden;height:calc(100vh - var(--nav-h));}

/* ── BOARD CONTROLS ── */
.board-controls{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.filter-label{font-family:'SashasFont',sans-serif;font-size:13px;font-weight:normal;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint);margin-right:4px;}
.filter-btn{font-family:'League Spartan',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;padding:5px 14px;border-radius:20px;border:1px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.filter-btn:hover{background:rgba(0,0,0,0.04);color:var(--text);}
.filter-btn.active[data-cat="all"]{background:var(--pink);color:#fff;border-color:var(--pink);}
.filter-btn.active[data-cat="Film"]{background:var(--cat-film);color:#fff;border-color:var(--cat-film);}
.filter-btn.active[data-cat="TV"]{background:var(--cat-tv);color:#fff;border-color:var(--cat-tv);}
.filter-btn.active[data-cat="Books"]{background:var(--cat-books);color:#fff;border-color:var(--cat-books);}
.filter-btn.active[data-cat="Music"]{background:var(--cat-music);color:#fff;border-color:var(--cat-music);}

.filter-btn.active[data-hcat="Books"]{background:var(--cat-books);color:#fff;border-color:var(--cat-books);}

/* ── BOARD ── */
.board{display:grid;grid-template-columns:repeat(4,1fr);flex:1;min-height:0;overflow:hidden;}
.column{display:flex;flex-direction:column;border-right:1px solid var(--border);min-height:0;overflow:hidden;}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px 12px 17px;cursor:grab;box-shadow:var(--shadow);transition:box-shadow 0.15s,transform 0.15s,opacity 0.15s;user-select:none;position:relative;overflow:hidden;height:auto;min-height:0;flex-shrink:0;}

.cat-TV{background:var(--cat-tv-bg);color:var(--cat-tv);}
.cat-Books{background:var(--cat-books-bg);color:var(--cat-books);}
.cat-Music{background:var(--cat-music-bg);color:var(--cat-music);}

/* ── FINISHED MONTH GROUPS ── */

/* ── HISTORY ── */
#page-history{overflow:hidden;flex-direction:column;}

.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.top-rated-section{margin-bottom:32px;}
.section-heading{font-family:'SashasFont',sans-serif;font-size:14px;font-weight:normal;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.section-heading::after{content:'';flex:1;height:1px;background:var(--border);}
.top-rated-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.top-rated-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:box-shadow 0.15s;}
.top-rated-card:hover{box-shadow:var(--shadow);}
.top-rated-score{font-family:'League Spartan',sans-serif;font-size:18px;font-weight:700;color:var(--coral);line-height:1;flex-shrink:0;min-width:28px;}

.top-rated-meta{font-size:11px;color:var(--text-faint);}
.year-section{margin-bottom:40px;}
.year-label{font-family:'SashasFont',sans-serif;font-size:18px;font-weight:normal;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.year-label::after{content:'';flex:1;height:1px;background:var(--border);}
.months-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}

.month-item-edit{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.15s;}
.month-item-edit:hover{background:#1a1a1a;color:var(--surface);}
.month-item-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px;}

.month-item-meta{font-size:10px;color:var(--text-faint);margin-top:1px;}
.history-empty{text-align:center;padding:60px 20px;color:var(--text-faint);}
.total-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px;display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
.history-empty h3{font-family:'League Spartan',sans-serif;font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text-muted);}

/* ── STARS ── */
.star{width:30px;height:30px;border-radius:4px;border:1.5px solid var(--border-strong);background:transparent;font-size:11px;font-family:'League Spartan',sans-serif;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all 0.1s;display:flex;align-items:center;justify-content:center;}
.star:hover,.star.lit{background:var(--coral);border-color:var(--coral);color:#fff;}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius);width:480px;max-width:calc(100vw - 40px);box-shadow:var(--shadow-lg);overflow:hidden;max-height:90vh;overflow-y:auto;}

.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--coral);}

.cat-picker{display:flex;gap:6px;flex-wrap:wrap;}
.cat-option{padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;font-family:'League Spartan',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;cursor:pointer;transition:all 0.15s;color:var(--text-muted);text-align:center;}
.cat-option[data-val="Film"]:hover,.cat-option[data-val="Film"].selected{background:var(--cat-film-bg);border-color:var(--cat-film);color:var(--cat-film);}
.cat-option[data-val="TV"]:hover,.cat-option[data-val="TV"].selected{background:var(--cat-tv-bg);border-color:var(--cat-tv);color:var(--cat-tv);}
.cat-option[data-val="Books"]:hover,.cat-option[data-val="Books"].selected{background:var(--cat-books-bg);border-color:var(--cat-books);color:var(--cat-books);}

.cat-option[data-val="Other"]:hover,.cat-option[data-val="Other"].selected{background:var(--cat-other-bg);border-color:var(--cat-other);color:var(--cat-other);}
.format-picker{display:flex;gap:8px;}

.format-option:hover{border-color:var(--teal);color:var(--teal);}
.format-option.selected{border-color:var(--teal);color:var(--teal);background:rgba(10,173,171,0.08);}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);}

/* ── ACTION SHEET ── */
.action-sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:2000;align-items:flex-end;justify-content:center;}
.action-sheet-overlay.open{display:flex;}

.action-sheet-item{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:15px;color:var(--text);font-family:'DM Sans',sans-serif;background:none;border:none;width:100%;text-align:left;cursor:pointer;}

@media(max-width:900px){

}

function showLoading(msg){let el=document.getElementById('loadingOverlay');if(!el){el=document.createElement('div');el.id='loadingOverlay';el.style.cssText='position:fixed;inset:0;background:rgba(254,244,221,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:League Spartan,sans-serif;';el.innerHTML=`<div style="font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#575757;" id="loadingMsg"></div><div style="margin-top:12px;width:40px;height:2px;background:#E43D7A;animation:lb 1s ease-in-out infinite alternate;"></div><style>@keyframes lb{from{transform:scaleX(0.2)}to{transform:scaleX(1)}}</style>`;document.body.appendChild(el);}document.getElementById('loadingMsg').textContent=msg;el.style.display='flex';}
function hideLoading(){const el=document.getElementById('loadingOverlay');if(el)el.style.display='none';}
function showError(msg){let el=document.getElementById('errorBanner');if(!el){el=document.createElement('div');el.id='errorBanner';el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:6px;font-size:12px;z-index:9999;';document.body.appendChild(el);}el.textContent=msg;el.style.display='block';setTimeout(()=>{el.style.display='none';},4000);}

async function loadData(){
  showLoading('Loading your list…');
  try{
    const rows=await db.get();
    data={};
    rows.forEach(r=>{data[r.id]={id:r.id,col:r.col||'onlist',cat:r.cat,title:r.title,meta:r.meta||'',note:r.note||'',bookType:r.book_type||null,format:r.format||null,rating:r.rating||null,thoughts:r.thoughts||'',custom:r.custom||false,doneAt:r.done_at||null};});
    // seed only if table is completely empty
    if(rows.length===0){
      const toInsert=SEED_ITEMS.map(item=>({id:item.id,col:'onlist',cat:item.cat,title:item.title,meta:item.meta||'',note:item.note||'',book_type:item.bookType||null,format:null,rating:null,thoughts:'',custom:false,done_at:null}));
      await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'resolution=ignore-duplicates'},body:JSON.stringify(toInsert)});
      SEED_ITEMS.forEach(item=>{data[item.id]={...item,col:'onlist',doneAt:null,custom:false,rating:null,thoughts:'',format:null,bookType:item.bookType||null};});
    }
  }catch(e){showError('Could not connect. Check your connection.');SEED_ITEMS.forEach(item=>{if(!data[item.id])data[item.id]={...item,col:'onlist',doneAt:null,custom:false,rating:null,thoughts:'',format:null,bookType:item.bookType||null};});}
  hideLoading();
}

async function saveItem(id){
  const item=data[id];if(!item)return;
  try{await db.upsert({id:item.id,col:item.col,cat:item.cat,title:item.title,meta:item.meta||'',note:item.note||'',book_type:item.bookType||null,format:item.format||null,rating:item.rating||null,thoughts:item.thoughts||'',custom:item.custom||false,done_at:item.doneAt||null});}
  catch(e){showError('Could not save.');}
}

function catColour(cat){const map={Film:'#F7603D',TV:'#388EEF',Books:'#0AADAB',Music:'#0AADAB',Stage:'#9653C9',Other:'#6B7280'};return map[cat]||'#9A9A9A';}

function updateColLabels(){
  const labels=COL_LABELS[activeFilter]||COL_LABELS.all;
  document.getElementById('col-title-onlist').textContent=labels[0];
  document.getElementById('col-title-upnext').textContent=labels[1];
  document.getElementById('col-title-current').textContent=labels[2];
  document.getElementById('col-title-finished').textContent=labels[3];
}

// ── RENDER BOARD ──
function renderBoard(){
  updateColLabels();
  const vis=visibleItems();

  // On The List, Up Next, Current — flat
  ['onlist','upnext','current'].forEach(col=>{
    const el=document.getElementById('col-'+col);
    el.innerHTML='';
    vis.filter(i=>i.col===col).forEach(item=>el.appendChild(makeCard(item)));
  });

  // Finished — grouped by month
  const finishedEl=document.getElementById('col-finished');
  finishedEl.innerHTML='';
  const finishedVis=vis.filter(i=>i.col==='finished');
  if(finishedVis.length>0){
    const groups={};
    finishedVis.forEach(item=>{const d=item.doneAt?new Date(item.doneAt):new Date();const key=`${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}`;if(!groups[key])groups[key]={label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`,items:[]};groups[key].items.push(item);});
    Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(key=>{
      const group=groups[key];
      const groupEl=document.createElement('div');groupEl.className='finished-month-group';
      const header=document.createElement('div');header.className='finished-month-header';
      header.style.background='rgba(228,61,122,0.55)';
      header.innerHTML=`<span class="finished-month-label">${group.label}</span><span class="finished-month-meta"><span>${group.items.length} item${group.items.length!==1?'s':''}</span><span class="finished-month-arrow">▾</span></span>`;
      const cardsEl=document.createElement('div');cardsEl.className='finished-month-cards';
      group.items.forEach(item=>cardsEl.appendChild(makeCard(item)));
      header.addEventListener('click',()=>{const open=cardsEl.style.display!=='none';cardsEl.style.display=open?'none':'flex';header.querySelector('.finished-month-arrow').classList.toggle('closed',open);});
      groupEl.appendChild(header);groupEl.appendChild(cardsEl);finishedEl.appendChild(groupEl);
    });
  }
  updateCounts();updateStats();
}

function makeCard(item){
  const div=document.createElement('div');
  div.className='card';div.dataset.id=item.id;div.dataset.cat=item.cat;div.draggable=true;
  div.style.borderLeftColor=catColour(item.cat);div.style.borderLeftWidth='4px';
  // Build subtype badges
  const allBadges=[];
  if(item.cat===BOOKS_CAT){
    if(item.bookType)allBadges.push(`<span class="booktype-badge">${item.bookType==='Fiction'?'📖 Fiction':'📋 Non-fiction'}</span>`);
    if(item.format)allBadges.push(`<span class="format-badge">${item.format==='Audio'?'🎧 Audio':'📚 Print'}</span>`);
  }
  if(item.cat==='Film'&&item.filmType)allBadges.push(`<span class="subtype-badge">${item.filmType==='Animation'?'🎨':item.filmType==='Documentary'?'🎥':'🎬'} ${item.filmType}</span>`);
  if(item.cat==='TV'&&item.tvType)allBadges.push(`<span class="subtype-badge">${item.tvType==='Animation'?'🎨':item.tvType==='Reality'?'📺':item.tvType==='Documentary'?'🎥':'🎭'} ${item.tvType}</span>`);
  if(item.cat==='Stage'){
    if(item.stageType)allBadges.push(`<span class="subtype-badge">${item.stageType==='Musical'?'🎵':'🎭'} ${item.stageType}</span>`);
    if(item.stageFormat)allBadges.push(`<span class="format-badge">${item.stageFormat==='Recorded'?'📹':'🏟️'} ${item.stageFormat}</span>`);
  }
  const noteId='note-'+item.id;
  div.innerHTML=`
    <div class="card-actions"><button class="card-action-btn edit" title="Edit">✎</button><button class="card-action-btn delete" title="Delete">✕</button></div>
    <div class="card-top"><span class="card-title">${esc(item.title)}</span><span class="cat-pill cat-${item.cat}">${item.cat}</span></div>
    <div class="card-meta">${esc(item.meta||'')}</div>
    ${item.note?`<div class="card-note" id="${noteId}">${esc(item.note)}</div><button class="card-see-more" data-note="${noteId}" style="display:none;">See more</button>`:''}
    ${allBadges.length?`<div class="card-badges">${allBadges.join('')}</div>`:''}
    ${item.rating?`<div class="card-rating"><div class="rating-badge">★ ${item.rating}/10</div></div>`:''}
    ${item.thoughts?`<div class="card-thoughts">${esc(item.thoughts)}</div>`:''}
    <button class="card-move-btn">Move ›</button>
  `;
  div.querySelector('.edit').addEventListener('click',e=>{e.stopPropagation();openEditModal(item.id);});
  // See more toggle
  requestAnimationFrame(()=>{
    const noteEl=div.querySelector('.card-note');
    const smBtn=div.querySelector('.card-see-more');
    if(noteEl&&smBtn){
      if(noteEl.scrollHeight>noteEl.clientHeight+2){
        smBtn.style.display='block';
        smBtn.addEventListener('click',e=>{e.stopPropagation();const expanded=noteEl.classList.toggle('card-note-expanded');smBtn.textContent=expanded?'See less':'See more';});
      }
    }
  });
  div.querySelector('.delete').addEventListener('click',e=>{e.stopPropagation();confirmDelete(item.id);});
  div.querySelector('.card-move-btn').addEventListener('click',e=>{e.stopPropagation();openActionSheet(item.id);});
  div.addEventListener('dragstart',onDragStart);div.addEventListener('dragend',onDragEnd);
  div.addEventListener('click',e=>{if(window.innerWidth<=900&&!e.target.closest('.card-action-btn')&&!e.target.closest('.card-move-btn'))openActionSheet(item.id);});
  return div;
}

function updateCounts(){COLS.forEach(col=>{document.getElementById('count-'+col).textContent=visibleItems().filter(i=>i.col===col).length;});}

function updateStats(){
  const finished=visibleItems().filter(i=>i.col==='finished');
  const total=visibleItems().length;
  const cats=['Film','TV','Books','Music','Stage','Other'];
  document.getElementById('statsStrip').innerHTML=cats.map(cat=>{const n=finished.filter(i=>i.cat===cat).length;if(n===0)return'';return`<span class="stat-item"><span class="stat-dot" style="background:${catColour(cat)}"></span>${n} ${cat.toLowerCase()}</span>`;}).join('')+`<span class="stat-item" style="color:var(--text-faint)">${finished.length}/${total} done</span>`;
}

// ── DRAG ──
function onDragStart(e){dragItem=e.currentTarget;dragItem.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragItem.dataset.id);placeholder=document.createElement('div');placeholder.className='drop-placeholder';}
function onDragEnd(){if(dragItem)dragItem.classList.remove('dragging');if(placeholder&&placeholder.parentNode)placeholder.parentNode.removeChild(placeholder);document.querySelectorAll('.col-body').forEach(c=>c.classList.remove('drag-over'));dragItem=null;placeholder=null;}

function setupColumns(){
  document.querySelectorAll('.col-body').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');const after=getDragAfter(col,e.clientY);if(placeholder){after==null?col.appendChild(placeholder):col.insertBefore(placeholder,after);}});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget)){col.classList.remove('drag-over');if(placeholder&&placeholder.parentNode===col)col.removeChild(placeholder);}});
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      if(placeholder&&placeholder.parentNode)placeholder.parentNode.removeChild(placeholder);
      const id=e.dataTransfer.getData('text/plain');const newCol=col.dataset.col;
      if(id&&newCol&&data[id]){
        const wasFinished=data[id].col==='finished';data[id].col=newCol;
        if(newCol==='finished'&&!wasFinished){data[id].doneAt=new Date().toISOString();renderBoard();if(document.getElementById('page-history').classList.contains('active'))renderHistory();openRatingModal(id);await saveItem(id);}
        else{if(newCol!=='finished')data[id].doneAt=null;renderBoard();if(document.getElementById('page-history').classList.contains('active'))renderHistory();await saveItem(id);}
      }
    });
  });
}

function getDragAfter(container,y){const els=[...container.querySelectorAll('.card:not(.dragging)')];return els.reduce((closest,child)=>{const box=child.getBoundingClientRect();const offset=y-box.top-box.height/2;if(offset<0&&offset>closest.offset)return{offset,element:child};return closest;},{offset:Number.NEGATIVE_INFINITY}).element;}

// ── HISTORY ──
let historyFilter='all',historyView='month';
function renderHistory(){
  const allFinished=allItems().filter(i=>i.col==='finished'&&i.doneAt);
  const finished=historyFilter==='all'?allFinished:allFinished.filter(i=>i.cat===historyFilter);

  // ── STATS STRIP ──
  const cats=['Film','TV','Books','Music','Stage','Other'];
  const yearNow=new Date().getFullYear();
  const thisYear=allFinished.filter(i=>new Date(i.doneAt).getFullYear()===yearNow);
  let statsHtml=`<div class="history-stats-row"><div class="history-stat-card"><div class="history-stat-label">Total ${yearNow}</div><div class="history-stat-num">${thisYear.length}</div><div class="history-stat-sub">finished</div></div>`;
  cats.forEach(cat=>{const n=thisYear.filter(i=>i.cat===cat).length;if(n===0)return;statsHtml+=`<div class="history-stat-card"><div class="history-stat-label"><span style="width:7px;height:7px;border-radius:50%;background:${catColour(cat)};display:inline-block;flex-shrink:0;"></span>${cat}</div><div class="history-stat-num">${n}</div><div class="history-stat-sub">this year</div></div>`;});
  statsHtml+=`</div>`;
  const activeCats=[...new Set(allFinished.map(i=>i.cat))];
  if(activeCats.length)statsHtml+=`<div class="history-legend">`+activeCats.map(cat=>`<div class="legend-item"><span class="legend-dot" style="background:${catColour(cat)}"></span>${cat}</div>`).join('')+`</div>`;
  document.getElementById('historyStats').innerHTML=statsHtml;

  // ── TOP RATED ──
  const topEl=document.getElementById('historyTopRated');
  if(historyFilter==='all'){
    const ri=allFinished.filter(i=>i.rating);
    let topHtml='';
    if(ri.length>0){topHtml=`<div class="top-rated-section"><div class="section-heading">Top Rated</div><div class="top-rated-grid">`;cats.forEach(cat=>{const cr=ri.filter(i=>i.cat===cat).sort((a,b)=>b.rating-a.rating);if(!cr.length)return;const top=cr[0];topHtml+=`<div class="top-rated-card" onclick="openEditModal('${top.id}')"><div class="top-rated-score">${top.rating}</div><div><div class="top-rated-title">${esc(top.title)}</div><div class="top-rated-meta">${cat}${top.meta?' · '+esc(top.meta):''}</div></div></div>`;});topHtml+=`</div></div>`;}
    topEl.innerHTML=topHtml;
  }else{topEl.innerHTML='';}

  // ── CONTENT ──
  const container=document.getElementById('historyContent');
  if(finished.length===0){container.innerHTML=`<div class="history-empty"><h3>Nothing here yet</h3><p>Move items to Finished and they'll appear here.</p></div>`;return;}

  // Shared item renderer
  function renderItem(item){
    const bookMeta=item.cat===BOOKS_CAT?[item.bookType,item.format==='Audio'?'🎧 Audio':item.format?'📚 Print':null].filter(Boolean).join(' · '):'';
    const subtypeMeta=[item.filmType,item.tvType,item.stageType&&item.stageFormat?item.stageType+' · '+item.stageFormat:item.stageType||item.stageFormat||null].filter(Boolean).join('');
    return `<div class="month-item"><button class="month-item-edit" onclick="openEditModal('${item.id}')" title="Edit">✎</button><div class="month-item-dot" style="background:${catColour(item.cat)}"></div><div><div class="month-item-text">${esc(item.title)}</div><div class="month-item-meta">${item.cat}${item.meta?' · '+esc(item.meta):''}${bookMeta?' · '+bookMeta:''}${subtypeMeta?' · '+subtypeMeta:''}${item.rating?' · ★ '+item.rating+'/10':''}</div>${item.thoughts?`<div style="font-size:11px;color:var(--text-muted);font-style:italic;margin-top:3px;line-height:1.4;">"${esc(item.thoughts)}"</div>`:''}</div></div>`;
  }

  if(historyView==='total'){
    // ── TOTAL: flat list sorted by date desc, grouped by year only ──
    const sorted=[...finished].sort((a,b)=>new Date(b.doneAt)-new Date(a.doneAt));
    const byYear={};
    sorted.forEach(item=>{const y=new Date(item.doneAt).getFullYear();if(!byYear[y])byYear[y]=[];byYear[y].push(item);});
    let html='';
    Object.keys(byYear).sort((a,b)=>b-a).forEach(year=>{
      html+=`<div class="year-section"><div class="year-label">${year} <span style="font-size:12px;font-weight:400;opacity:0.6;">${byYear[year].length} item${byYear[year].length!==1?'s':''}</span></div>`;
      html+=`<div class="total-list">`;
      html+=byYear[year].map(item=>renderItem(item)).join('');
      html+=`</div></div>`;
    });
    container.innerHTML=html;
  } else {
    // ── BY MONTH: original month-card grid ──
    const grouped={};finished.forEach(item=>{const d=new Date(item.doneAt);const key=`${d.getFullYear()}-${d.getMonth()}`;if(!grouped[key])grouped[key]={year:d.getFullYear(),month:d.getMonth(),items:[]};grouped[key].items.push(item);});
    const byYear={};Object.values(grouped).sort((a,b)=>b.year-a.year||b.month-a.month).forEach(g=>{if(!byYear[g.year])byYear[g.year]=[];byYear[g.year].push(g);});
    let html='';
    Object.keys(byYear).sort((a,b)=>b-a).forEach(year=>{
      html+=`<div class="year-section"><div class="year-label">${year}</div><div class="months-grid">`;
      byYear[year].forEach(group=>{html+=`<div class="month-card"><div class="month-card-header"><span class="month-name">${MONTHS[group.month]}</span><span class="month-count">${group.items.length} item${group.items.length!==1?'s':''}</span></div><div class="month-items">`;html+=group.items.map(item=>renderItem(item)).join('');html+=`</div></div>`;});
      html+=`</div></div>`;
    });
    container.innerHTML=html;
  }
}

  renderBoard();closeModal();await saveItem(id);
});

// ── RATING MODAL ──
const THOUGHTS_PROMPTS=['What stayed with you after you finished?','Would you recommend it, and to whom?','What surprised you most?','How did it make you feel?','What was the best thing about it?','Did it meet your expectations?','What would you change about it?','One word to describe it?','Who else needs to experience this?','What did it remind you of?'];
let pendingRatingId=null,currentRating=0;
(function(){const sel=document.getElementById('ratingYear');const ty=new Date().getFullYear();for(let y=ty;y>=ty-10;y--){const opt=document.createElement('option');opt.value=y;opt.textContent=y;sel.appendChild(opt);}})();
function openRatingModal(id){pendingRatingId=id;currentRating=data[id].rating||0;const item=data[id];document.getElementById('ratingItemTitle').textContent=item.title;document.getElementById('ratingItemMeta').textContent=item.meta||'';document.getElementById('thoughtsInput').value=item.thoughts||'';document.getElementById('thoughtsPrompt').textContent=THOUGHTS_PROMPTS[Math.floor(Math.random()*THOUGHTS_PROMPTS.length)];const d=item.doneAt?new Date(item.doneAt):new Date();document.getElementById('ratingMonth').value=d.getMonth();document.getElementById('ratingYear').value=d.getFullYear();buildStars();document.getElementById('ratingOverlay').classList.add('open');}
function buildStars(){const row=document.getElementById('starRow');row.innerHTML='';for(let i=1;i<=10;i++){const btn=document.createElement('button');btn.className='star'+(i<=currentRating?' lit':'');btn.textContent=i;btn.addEventListener('mouseenter',()=>highlightStars(i));btn.addEventListener('mouseleave',()=>highlightStars(currentRating));btn.addEventListener('click',()=>{currentRating=i;highlightStars(i);updateReadout();});row.appendChild(btn);}updateReadout();}
function highlightStars(n){document.querySelectorAll('#starRow .star').forEach((s,i)=>s.classList.toggle('lit',i<n));}
function updateReadout(){const labels=['','Terrible','Poor','Disappointing','Mediocre','Average','Decent','Good','Great','Excellent','Perfect'];document.getElementById('ratingReadout').textContent=currentRating>0?`${currentRating}/10 — ${labels[currentRating]}`:'Not rated';}
function closeRatingModal(){document.getElementById('ratingOverlay').classList.remove('open');pendingRatingId=null;currentRating=0;}
document.getElementById('closeRating').addEventListener('click',closeRatingModal);
document.getElementById('skipRating').addEventListener('click',closeRatingModal);
document.getElementById('ratingOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('ratingOverlay'))closeRatingModal();});
document.getElementById('submitRating').addEventListener('click',async()=>{if(pendingRatingId){const month=document.getElementById('ratingMonth').value;const year=document.getElementById('ratingYear').value;if(month!==''&&year)data[pendingRatingId].doneAt=new Date(Date.UTC(parseInt(year),parseInt(month),1,12)).toISOString();if(currentRating>0)data[pendingRatingId].rating=currentRating;const thoughts=document.getElementById('thoughtsInput').value.trim();if(thoughts)data[pendingRatingId].thoughts=thoughts;renderBoard();if(document.getElementById('page-history').classList.contains('active'))renderHistory();await saveItem(pendingRatingId);}closeRatingModal();});

// ── EDIT MODAL ──
let editingId=null,editCat='Film',editBookType='Fiction',editFormat='Print',editFilmType='Live Action',editTVType='Drama',editStageType='Play',editStageFormat='Live';
function openEditModal(id){
  editingId=id;const item=data[id];
  document.getElementById('editTitle').value=item.title;
  document.getElementById('editMeta').value=item.meta||'';
  document.getElementById('editNote').value=item.note||'';
  document.getElementById('editThoughts').value=item.thoughts||'';
  editCat=item.cat;editBookType=item.bookType||'Fiction';editFormat=item.format||'Print';editFilmType=item.filmType||'Live Action';editTVType=item.tvType||'Drama';editStageType=item.stageType||'Play';editStageFormat=item.stageFormat||'Live';
  document.querySelectorAll('#editCatPicker .cat-option').forEach(b=>b.classList.toggle('selected',b.dataset.val===editCat));
  updateSubFields(editCat,'edit');
  document.querySelectorAll('#editBookTypePicker .format-option').forEach(b=>b.classList.toggle('selected',b.dataset.val===editBookType));
  document.querySelectorAll('#editFormatPicker .format-option').forEach(b=>b.classList.toggle('selected',b.dataset.val===editFormat));
  document.querySelectorAll('#editFilmTypePicker .format-option').forEach(b=>b.classList.toggle('selected',b.dataset.val===editFilmType));
  document.querySelectorAll('#editTVTypePicker .format-option').forEach(b=>b.classList.toggle('selected',b.dataset.val===editTVType));
  document.querySelectorAll('#editStagetypePicker .format-option, #editStageTypePicker .format-option').forEach(b=>b.classList.toggle('selected',b.dataset.val===editStageType));
  document.querySelectorAll('#editStageFormatPicker .format-option').forEach(b=>b.classList.toggle('selected',b.dataset.val===editStageFormat));
  document.getElementById('editOverlay').classList.add('open');
}
function closeEditModal(){document.getElementById('editOverlay').classList.remove('open');editingId=null;}
document.getElementById('closeEdit').addEventListener('click',closeEditModal);
document.getElementById('cancelEdit').addEventListener('click',closeEditModal);
document.getElementById('editOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('editOverlay'))closeEditModal();});
document.querySelectorAll('#editCatPicker .cat-option').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('#editCatPicker .cat-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');editCat=btn.dataset.val;updateSubFields(editCat,'edit');});});
document.querySelectorAll('#editBookTypePicker .format-option').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('#editBookTypePicker .format-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');editBookType=btn.dataset.val;});});
document.querySelectorAll('#editFormatPicker .format-option').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('#editFormatPicker .format-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');editFormat=btn.dataset.val;});});
document.querySelectorAll('#editFilmTypePicker .format-option').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('#editFilmTypePicker .format-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');editFilmType=btn.dataset.val;});});
document.querySelectorAll('#editTVTypePicker .format-option').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('#editTVTypePicker .format-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');editTVType=btn.dataset.val;});});
document.querySelectorAll('#editStageTypePicker .format-option').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('#editStageTypePicker .format-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');editStageType=btn.dataset.val;});});
document.querySelectorAll('#editStageFormatPicker .format-option').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('#editStageFormatPicker .format-option').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');editStageFormat=btn.dataset.val;});});
document.getElementById('submitEdit').addEventListener('click',async()=>{
  if(!editingId)return;const title=document.getElementById('editTitle').value.trim();if(!title){document.getElementById('editTitle').focus();return;}
  const isBook=editCat===BOOKS_CAT;
  data[editingId].title=title;data[editingId].meta=document.getElementById('editMeta').value.trim();data[editingId].note=document.getElementById('editNote').value.trim();data[editingId].thoughts=document.getElementById('editThoughts').value.trim();data[editingId].cat=editCat;data[editingId].bookType=isBook?editBookType:null;data[editingId].format=isBook?editFormat:null;data[editingId].filmType=editCat==='Film'?editFilmType:null;data[editingId].tvType=editCat==='TV'?editTVType:null;data[editingId].stageType=editCat==='Stage'?editStageType:null;data[editingId].stageFormat=editCat==='Stage'?editStageFormat:null;
  renderBoard();if(document.getElementById('page-history').classList.contains('active'))renderHistory();await saveItem(editingId);closeEditModal();
});

// ── DELETE ──
async function confirmDelete(id){
  if(!confirm(`Delete "${data[id].title}"? This cannot be undone.`))return;
  delete data[id];renderBoard();if(document.getElementById('page-history').classList.contains('active'))renderHistory();
  try{const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,Prefer:'return=minimal'}});if(!res.ok)showError('Could not delete.');}catch(e){showError('Could not delete.');}
}

// ── ACTION SHEET ──
let actionSheetId=null;
function openActionSheet(id){actionSheetId=id;document.getElementById('actionSheetTitle').textContent=data[id].title;COLS.forEach(col=>{const btn=document.getElementById('as-'+col);if(btn)btn.style.display=data[id].col===col?'none':'flex';});document.getElementById('actionSheetOverlay').classList.add('open');}
function closeActionSheet(){document.getElementById('actionSheetOverlay').classList.remove('open');actionSheetId=null;}
async function moveCardTo(col){if(!actionSheetId)return;const id=actionSheetId;closeActionSheet();const wasFinished=data[id].col==='finished';data[id].col=col;if(col==='finished'&&!wasFinished){data[id].doneAt=new Date().toISOString();renderBoard();if(document.getElementById('page-history').classList.contains('active'))renderHistory();openRatingModal(id);await saveItem(id);}else{if(col!=='finished')data[id].doneAt=null;renderBoard();if(document.getElementById('page-history').classList.contains('active'))renderHistory();await saveItem(id);}}
COLS.forEach(col=>{const btn=document.getElementById('as-'+col);if(btn)btn.addEventListener('click',()=>moveCardTo(col));});
document.getElementById('as-edit').addEventListener('click',()=>{const id=actionSheetId;closeActionSheet();openEditModal(id);});
document.getElementById('as-delete').addEventListener('click',()=>{const id=actionSheetId;closeActionSheet();confirmDelete(id);});
document.getElementById('as-cancel').addEventListener('click',closeActionSheet);
document.getElementById('actionSheetOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('actionSheetOverlay'))closeActionSheet();});

function esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

(async()=>{await loadData();renderBoard();setupColumns();})();
</script>
</body>
